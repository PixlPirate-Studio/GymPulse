<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GymPulse</title>
<meta name="theme-color" content="#090D16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymPulse">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/style.css">
<script>(function(){try{var t=localStorage.getItem("gp_theme");if(!t)t=(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";document.documentElement.setAttribute("data-theme",t);var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==="light"?"#F4F5F1":"#090D16";document.addEventListener("DOMContentLoaded",function(){document.body.classList.toggle("light-strip",t==="light")})}catch(e){}})()</script>
</head>
<body>
<div id="app"></div>
<nav id="nav" hidden></nav>
<script src="/static/anim.js"></script>
<script src="/static/app.js"></script>
<script src="/static/features.js"></script>
</body>
</html>
